<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Calorie Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Food Calorie Counter</h1>
        <form id="calorie-counter">
            <label for="budget">Daily Calorie Budget</label>
            <input type="number" id="budget" placeholder="Enter calorie budget" min="0">

            <fieldset>
                <legend>Food Intake</legend>
                <div id="food-entries"></div>
                <button type="button" id="add-food">+ Add Food</button>
            </fieldset>

            <fieldset>
                <legend>Exercise</legend>
                <div id="exercise-entries"></div>
                <button type="button" id="add-exercise">+ Add Exercise</button>
            </fieldset>

            <button type="submit">Calculate Calories</button>
            <button type="button" id="clear">Clear</button>
        </form>

        <div id="output" class="output hide">
            <p><strong>Total Calories Consumed:</strong> <span id="calories-consumed">0</span></p>
            <p><strong>Total Calories Burned:</strong> <span id="calories-burned">0</span></p>
            <p><strong>Remaining Calories:</strong> <span id="remaining-calories">0</span></p>
            <p><strong>Calorie Status:</strong> <span id="calorie-status">Balanced</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
